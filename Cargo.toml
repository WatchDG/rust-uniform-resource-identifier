[package]
name = "uniform-resource-identifier"
version = "0.0.13"
authors = ["WatchDG <baranov@w3m.co>"]
license = "MIT OR Apache-2.0"
description = "uniform resource identifier"
homepage = "https://github.com/WatchDG/rust-uniform-resource-identifier"
documentation = "https://docs.rs/uniform-resource-identifier"
repository = "https://github.com/WatchDG/rust-uniform-resource-identifier"
readme = "README.md"
edition = "2018"
exclude = [
    ".github/**/*",
    "src/main.rs",
    ".gitignore"
]

[dependencies]
bytes = "1.1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "uri"
harness = false